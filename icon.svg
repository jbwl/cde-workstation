<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Background fill (Motif gray) -->
  <rect width="128" height="128" rx="4" fill="#C8C8C4"/>

  <!-- Outer raised bevel -->
  <path d="M0,128 L0,0 L128,0 L122,6 L6,6 L6,122 Z" fill="#E8E8E4"/>
  <path d="M128,0 L128,128 L0,128 L6,122 L122,122 L122,6 Z" fill="#8A8A88"/>

  <!-- Inner sunken panel -->
  <rect x="14" y="14" width="100" height="100" rx="2" fill="#182020"/>

  <!-- Inner sunken bevel -->
  <path d="M14,114 L14,14 L114,14 L111,17 L17,17 L17,111 Z" fill="#0A1010"/>
  <path d="M114,14 L114,114 L14,114 L17,111 L111,111 L111,17 Z" fill="#283332"/>

  <!-- Title bar -->
  <rect x="20" y="20" width="88" height="16" rx="1" fill="#174E84"/>

  <!-- Stylized "CDE" text - bold and simple -->
  <text x="64" y="33" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">CDE</text>

  <!-- Three colored bars representing code (simple, bold) -->
  <rect x="24" y="44" width="34" height="6" rx="2" fill="#4E777A"/>
  <rect x="62" y="44" width="20" height="6" rx="2" fill="#79B9B4"/>

  <rect x="24" y="56" width="22" height="6" rx="2" fill="#8DBB91"/>
  <rect x="50" y="56" width="36" height="6" rx="2" fill="#8DBB91"/>

  <rect x="24" y="68" width="28" height="6" rx="2" fill="#86A8D2"/>
  <rect x="56" y="68" width="16" height="6" rx="2" fill="#D2AD63"/>

  <rect x="32" y="80" width="24" height="6" rx="2" fill="#C69ABA"/>
  <rect x="60" y="80" width="30" height="6" rx="2" fill="#79B9B4"/>

  <rect x="24" y="92" width="18" height="6" rx="2" fill="#86A8D2"/>

  <!-- Status bar -->
  <rect x="20" y="102" width="88" height="10" rx="1" fill="#174E84"/>
</svg>
